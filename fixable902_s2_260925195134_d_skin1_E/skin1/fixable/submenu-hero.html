<!-- 상품분류 목록에서만 보이는 검색창 (상품검색 페이지는 자체 검색창이 있다) -->
<form class="fixable-list-search" action="/product/search.html" method="get" role="search" hidden>
 <label for="fixableListKeyword" class="displaynone">상품 검색</label>
 <input id="fixableListKeyword" name="keyword" type="search" placeholder="업종이나 스킨 이름으로 찾아보세요" autocomplete="off">

<script>
(function(){
 var hero=document.querySelector('.fixable-menu-hero');if(!hero)return;
 var params=new URLSearchParams(location.search),word=params.get('keyword')||'',path=location.pathname,board=path.indexOf('/board/')===0;
 var catm=path.match(/\/category\/[^\/]+\/(\d+)/),cate=String(params.get('cate_no')||(catm&&catm[1])||'');
 var list=/\/product\/list\.html$/.test(path)||!!catm;
 // 게시판 : 리뷰(4) · 공지사항(1) · 자주묻는질문(3) · 상품문의(6) 은 같은 배너를 쓴다
 var boardKey={'4':'review','1':'notice','3':'faq','6':'qna'}[params.get('board_no')];
 if(board&&!boardKey){hero.remove();return;}
 // SALE(27)은 전용 세일 화면이 따로 있다
 if(list&&cate==='27'){hero.remove();return;}
 // 상품분류 번호 : 28 전체 스킨 · 24 패션·뷰티 · 25 키즈·펫 · 26 푸드·리빙 (관리자 대분류)
 var byCate={'28':'all','24':'fashion','25':'family','26':'living'};
 var key=board?boardKey:list?(byCate[cate]||'all'):/푸드|식품|리빙|인테리어|가구|FOOD|INTER/i.test(word)?'living':/키즈|아기|유아|펫|반려|BABY|PET/i.test(word)?'family':/패션|의류|뷰티|화장품|코스메틱|WEAR|EPPUM/i.test(word)?'fashion':'all';
 // 배너 내용 : 게시판 화면 관리의 '목록 위 큰 배너' 글로 바꿀 수 있다 (fixable-cms.js 가 window.FIXABLE_MENU_HERO 를 덮어쓴다)
 var banners=window.FIXABLE_MENU_HERO=window.FIXABLE_MENU_HERO||{
  all:['hero-fixable.webp','fixable 이 만든 쇼핑몰 6곳의 첫 화면','READY-MADE STORE SKINS','Stores that<br>actually sell.','업종별로 완성된 카페24 쇼핑몰 스킨.<br>데모에서 눌러 보고 마음에 드는 화면을 고르세요.'],
  fashion:['work-wear.webp','여성 의류 쇼핑몰 WEAR902 의 첫 화면','FASHION · BEAUTY','Look good.<br>Sell better.','옷과 화장품처럼 ‘어울릴까?’가 중요한 업종.<br>스타일 · 루틴 찾기가 들어간 스킨이에요.'],
  family:['work-baby.webp','아기용품 쇼핑몰 BABYANG 의 첫 화면','KIDS · PET','Made with care.<br>Chosen with love.','아이와 반려동물을 위한 업종.<br>월령 · 반려동물별로 고르기 쉬운 스킨이에요.'],
  living:['work-inter.webp','인테리어 쇼핑몰 INTER902 의 첫 화면','FOOD · LIVING','Everyday table.<br>Everyday home.','식탁과 집을 채우는 업종.<br>장면 속 상품으로 한 번에 담게 하는 스킨이에요.'],
  review:['work-eppum.webp','K-뷰티 쇼핑몰 EPPUM902 의 첫 화면','CLIENT NOTES','Real stores.<br>Real reviews.','먼저 오픈한 사장님들의 이야기.<br>스킨을 고르기 전에 읽어 보세요.'],
  notice:['work-food.webp','식품 쇼핑몰 FOOD902 의 첫 화면','NEWS &amp; NOTICE','Little news.<br>From fixable.','새로 나온 스킨과 업데이트,<br>꼭 알아 두실 안내를 전해 드려요.'],
  faq:['work-pet.webp','반려동물 쇼핑몰 PETPIA 의 첫 화면','GOOD TO KNOW','Questions?<br>We have answers.','설치 · 수정 · 환불에 대해<br>자주 묻는 질문을 모았어요.'],
  qna:['work-wear.webp','여성 의류 쇼핑몰 WEAR902 의 첫 화면','START A PROJECT','Let\'s fix<br>your store.','쇼핑몰 주소와 업종, 원하는 점을 남겨 주세요.<br>맞는 스킨과 견적을 하루 안에 답해 드려요.']
 },img=hero.querySelector('img');
 var C=window.FIXABLE_CMS;
 // 배경색은 게시판 글과 상관없으므로 기다리지 않고 바로 정한다
 hero.dataset.collection=key;
 function reveal(){hero.classList.add('is-ready')}
 function fill(){
  var data=banners[key]||banners.all;
  // 게시판을 아직 읽는 중이면 채우기만 하고 가려 둔다 (fixable-cms.js 의 cms-wait)
  if(!C||!C.holding||!C.holding())hero.classList.add('is-filled');
  img.alt=data[1];hero.querySelector('small').textContent=data[2];hero.querySelector('h1').innerHTML=data[3];hero.querySelector('p').innerHTML=data[4];
  var src=/^(https?:)?\/\/|^\//.test(data[0])?data[0]:'/SkinImg/fixable/'+data[0];
  if(img.getAttribute('src')!==src){hero.classList.remove('is-ready');img.src=src}
  img.addEventListener('load',reveal,{once:true});img.addEventListener('error',reveal,{once:true});if(img.complete&&img.naturalWidth)reveal();
 }
 // 기억해 둔 최신 내용이 있으면 페이지를 다 읽기 전에 바로 그린다.
 // 없으면 게시판 글이 다 읽힐 때까지 기다렸다가 그리고, 나중에 새 글이 오면 다시 그린다
 if(C){if(C.applyCachedSection&&C.applyCachedSection(hero))fill();C.ready(fill,1200);document.addEventListener('fixable:cms',fill)}else fill();
 var cur=hero.querySelector('[data-fixable-menu="'+key+'"]');if(cur)cur.setAttribute('aria-current','page');
 var form=document.querySelector('.fixable-list-search');if(form&&list)form.hidden=false;
}());
</script>
